services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - bagnet

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      # Optional: override if you prefer env over .env file (bootstrap reads .env first)
      BAG_DB_HOST: mysql
      BAG_DB_USER: ${MYSQL_USER:-bag}
      BAG_DB_PASS: ${MYSQL_PASSWORD:-bag}
      BAG_DB_NAME: ${MYSQL_DATABASE:-bag_biz}
      LARAVEL_APP_URL: ${LARAVEL_APP_URL:-http://localhost:8080}
      # Laravel storefront uses the same schema as Phinx (bag_biz) unless overridden
      LARAVEL_DB_DATABASE: ${LARAVEL_DB_DATABASE:-bag_biz}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bagnet

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bag_biz}
      MYSQL_USER: ${MYSQL_USER:-bag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bag}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/02-create-laravel-db.sql:/docker-entrypoint-initdb.d/02-create-laravel-db.sql:ro
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - bagnet

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-bag}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bagnet

networks:
  bagnet:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
